[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/prompt",
    "crates/llm",
    "crates/stt",
    "crates/audio",
    "crates/settings",
    "crates/session",
    "crates/shell",
    "src-tauri",
]

# THE single version source. Every crate uses `version.workspace = true`;
# package.json, tauri.conf.json and the UI chip are checked against this by
# `node tools/check-version.mjs` (CI fails on drift).
[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
callcore-contract = { path = "crates/contract" }
callcore-prompt = { path = "crates/prompt" }
callcore-llm = { path = "crates/llm" }
callcore-stt = { path = "crates/stt" }
callcore-audio = { path = "crates/audio" }
callcore-settings = { path = "crates/settings" }
callcore-session = { path = "crates/session" }
callcore-shell = { path = "crates/shell" }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
tokio-util = { version = "0.7", default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
tracing = "0.1"
ts-rs = "10"
tempfile = "3"
cpal = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": a panic inside one session task must only
# fail that answer, never take the process down.
